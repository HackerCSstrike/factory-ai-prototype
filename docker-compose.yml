services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - factory_net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    entrypoint: >-
      sh -c "ollama serve &
      ollama_pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull qwen2.5:1.5b;
      ollama pull nomic-embed-text;
      wait $$ollama_pid"
    networks:
      - factory_net

  backend:
    build: ./backend
    ports:
      - "7860:7860"
    volumes:
      - ./data/docs:/app/data/docs
      - ./backend:/app
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_LLM_MODEL=qwen2.5:1.5b
      - QDRANT_HOST=http://qdrant:6333
    depends_on:
      - qdrant
      - ollama
    networks:
      - factory_net

networks:
  factory_net:
    driver: bridge
    # internal: true  # Раскомментируйте для полной блокировки интернета внутри сети
